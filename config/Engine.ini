[Core.System]
Paths=../../../Engine/Content
Paths=%GAMEDIR%Content

; ================= LatencyLab performance overlay v2 =================
; File is READ-ONLY on purpose. Fortnite rewrites Engine.ini on every
; launch; read-only is the only thing that makes an overlay survive.
; To let Fortnite manage it again: attrib -R on this file.
[/Script/Engine.RendererSettings]
r.FinishCurrentFrame=0
r.Streaming.PoolSize=4096
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.UseFixedPoolSize=1
r.Streaming.UseAllMips=0
r.Nanite=0
r.HZBOcclusion=1
r.VRS.Enable=1
r.VSync=0
rhi.SyncInterval=0

[SystemSettings]
r.Streaming.PoolSize=4096
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.UseFixedPoolSize=1
